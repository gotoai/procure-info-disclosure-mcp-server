[project]
name = "procure-info-disclosure-mcp-server"
version = "0.1.0"
description = "A skill-style MCP server for 調達ポータル, Japan's government procurement portal (調達情報等公開機能)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
procure-info-disclosure-mcp-server = "procure_info_disclosure_mcp_server.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procure_info_disclosure_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real 調達ポータル (set PROCURE_LIVE=1 to run)"]

[tool.ruff]
line-length = 100
target-version = "py311"
